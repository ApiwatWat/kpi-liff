<!DOCTYPE html>
<html lang="th">
<head>
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Monitor — กำลังเข้าสู่ระบบ</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { margin:0; font-family:'Prompt','Leelawadee UI',sans-serif; background:#FFF7F0;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { text-align:center; padding:32px; }
  .spin { width:44px; height:44px; border:4px solid #FBE5CD; border-top-color:#C2410C;
          border-radius:50%; margin:0 auto 18px; animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  h1 { font-size:17px; color:#3B2817; margin:0 0 6px; }
  p  { font-size:13px; color:#6B4A2B; margin:0; }
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <h1>กำลังยืนยันตัวตนผ่าน LINE...</h1>
  <p id="msg">รอสักครู่</p>
</div>
<script>
/* LIFF launcher (10 ส.ค.69) — liff.init dies inside the Apps Script iframe,
 * so this GitHub-hosted page (same origin as the daily-coach LIFF, where LIFF
 * provably works) does the LINE handshake, trades the idToken for a 60-second
 * single-use code via doPost liff_line_login, and forwards the user to the
 * Apps Script app with ONLY that code in the URL — the session token itself
 * never rides a URL. No code / any failure → forwarded without otc → the
 * app's normal email+OTP login shows instead. */
/* Two URLs, and they must stay apart (Track C cutover, 11 ส.ค. 2569).
   API_URL is where the LINE idToken is exchanged for a one-time code. That is
   Apps Script's liff_line_login, and the Worker does not have it — it has
   otc_exchange, which it calls server-side after the browser arrives. Pointing
   API_URL at the Worker would break LINE login for everyone while looking like
   a one-line change.
   APP_URL is only where the person is SENT once the code exists.
   TO ROLL BACK: set APP_URL back to API_URL. */
var API_URL = 'https://script.google.com/macros/s/AKfycbw_svUdey6l6A0uNVFAYEnF6pyPA_hWdVifQwX4zGY2BnW50SbtKoQ4UscNdOvDRTs/exec';
var APP_URL = 'https://kpi-front.www-apiwat-wat-com.workers.dev';

function qp(name) {
  var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}

/* `view` overrides `to`, and both are read (11 ส.ค.69).
   `to` arrives baked into the LIFF's own endpoint URL, so one LIFF can only ever
   mean one destination. `view` arrives from the link that was tapped, which lets
   a SINGLE LIFF serve both buttons:
       https://liff.line.me/<id>            → whatever its endpoint says
       https://liff.line.me/<id>?view=web   → the desktop app, same LIFF
   Added because the Dashboard LIFF answered 400 at access.line.me and the app
   should not be hostage to a second LIFF registration. Existing links are
   unaffected: with no `view`, this is exactly the old behaviour. */
var TO  = qp('view') || qp('to') || 'mobile';
var LID = qp('lid');
var DEST = APP_URL + (TO === 'mobile' ? '/?view=mobile' : '/');

function go(otc) {
  location.replace(DEST + (otc ? (TO === 'mobile' ? '&' : '?') + 'otc=' + encodeURIComponent(otc) : ''));
}

function fail(msg) {
  dbg('fail', msg || '');
  say('เปิดหน้า login ปกติแทน...');
  setTimeout(function() { go(null); }, 900);
}

/* Diagnostics go to the console, never to the screen (11 ส.ค. 2569).
   While chasing the LIFF 400 these lines were printed into #err, so EVERY normal
   visitor met a red "v3 · … · lid=…" line on a page that was working fine. The
   information is still worth having when it breaks — it just belongs where only
   someone debugging will look. On-screen text stays in #msg and stays in Thai. */
var BUILD = 'v4 · 11 ส.ค. 2569';
function dbg(label, extra) {
  try { console.log('[launch] ' + BUILD + ' · ' + label + (extra ? ' · ' + extra : '')); } catch (e) {}
}
function say(text) {
  var m = document.getElementById('msg');
  if (m) m.textContent = text;
}
dbg('เริ่ม', 'lid=' + (LID || '(ว่าง)') + ' to=' + TO);

if (!LID) { fail('ไม่มี lid ใน endpoint URL'); }
else {
  liff.init({ liffId: LID }).then(function() {
    if (!liff.isLoggedIn()) {
      /* Inside the LINE app the user IS logged in, so reaching here means LINE
         will not grant this LIFF a session — and bouncing to LINE Login then
         dead-ends on its own 400 page with no way forward. Seen live 11 ส.ค.69
         on the Dashboard LIFF: the page appeared for a second and then became a
         LINE error screen, and the person could go no further.
         The app already has a way in without LINE. Use it rather than stranding
         them. liff.login is kept only for a real external browser, where it is
         the correct move and where a failure still lands on the same fallback. */
      if (liff.isInClient()) {
        // Never bounce to LINE Login from inside the LINE app: it answered 400
        // and that page cannot be copied, shared or opened elsewhere, so the
        // reason was unreadable. Say what we know here instead.
        dbg('ไม่ได้ login', 'inClient=true os=' + (liff.getOS ? liff.getOS() : '?'));
        /* 6 s used to be the time needed to READ the on-screen debug line. With
           the line gone that is 6 s of a spinner saying nothing, so the wait is
           only what a redirect needs. */
        say('เปิดหน้า login ปกติแทน...');
        setTimeout(function () { go(null); }, 900);
        return;
      }
      liff.login({ redirectUri: location.href });
      return;
    }
    var idt = null;
    try { idt = liff.getIDToken(); } catch (e) {}
    if (!idt) { fail('ไม่ได้ idToken (ต้องเปิด scope openid)'); return; }
    document.getElementById('msg').textContent = 'ตรวจสอบสิทธิ์กับเซิร์ฟเวอร์...';
    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'liff_line_login', id_token: idt })
    }).then(function(r) { return r.json(); })
      .then(function(r) {
        if (r && r.ok && r.otc) { go(r.otc); }
        else { fail(r && r.msg ? r.msg : 'login ไม่สำเร็จ'); }
      })
      .catch(function(e) { fail('เครือข่ายขัดข้อง'); });
  }).catch(function(e) {
    dbg('init ล้มเหลว', (e && (e.code || e.message)) ? (e.code || e.message) : String(e));
    say('เปิดหน้า login ปกติแทน...');
    setTimeout(function () { go(null); }, 900);
  });
}
</script>
</body>
</html>
